{% extends "templates/web.html" %}
{% block title %}Rosenta comparison{% endblock %}
{% block page_content %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Rosenta comparison: stand-alone page in the Upande avocado design. TEMPORARY, see rosenta_compare.py. */
html.rc-root,html.rc-root body{margin:0!important;padding:0!important;background:#f4f3ef!important}
html.rc-root .navbar,html.rc-root .web-footer,html.rc-root footer.web-footer,html.rc-root .page-breadcrumbs,
html.rc-root .page-header-wrapper,html.rc-root .website-banner,html.rc-root .btn-edit-page,
html.rc-root .scroll-to-top,html.rc-root .page-footer{display:none!important}
.rc{
  --ink:#0a0a0a;--ink-1:#1a1a18;--ink-3:#3a3a34;--ink-4:#5a5a52;--ink-mute:#8a8780;--ink-faint:#b8b6ae;
  --bg:#f4f3ef;--surface:#fafaf6;--card:#fff;--hair:rgba(10,10,10,.07);
  --avo-100:#eef3dd;--avo-500:#7aa23f;--avo-600:#5d8230;--avo-700:#44631f;
  --warn:#d9962e;--neg:#c4302b;--pit-deep:#8a6a3b;
  --shadow:0 1px 0 rgba(10,10,10,.04),0 8px 32px -16px rgba(10,10,10,.10);
  --grad-ink:linear-gradient(135deg,#0a0a0a 0%,#3a3a34 100%);
  --grad-avo:linear-gradient(135deg,#44631f 0%,#7aa23f 100%);
  font:14px/1.55 'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink-3);
  background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.rc *{box-sizing:border-box}
.rc button{font-family:inherit}
.rc :where(button,input):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.rc *{transition:none!important;animation:none!important}}

.rc-top{background:var(--card);padding:14px 40px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--hair)}
.rc-top__mark{width:30px;height:30px;border-radius:9px;background:var(--grad-ink);color:#fafaf6;display:grid;place-items:center;font:700 14px 'Poppins',sans-serif}
.rc-top__name{font:600 14px 'Poppins',sans-serif;color:var(--ink);letter-spacing:-.2px}
.rc-top__name small{display:block;font:500 10px 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:1.6px;color:var(--ink-mute)}
.rc-top__right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-mute)}

.rc-page{max-width:1480px;margin:0 auto;padding:40px 40px 80px}
.rc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:28px}
.rc-eyebrow{font:500 11px 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:2.2px;color:var(--ink-mute);margin-bottom:10px;display:inline-flex;align-items:center;gap:10px}
.rc-eyebrow::before{content:"";width:18px;height:1px;background:var(--ink-3)}
.rc-title{font:600 40px/1.05 'Poppins',sans-serif;color:var(--ink);letter-spacing:-1.2px;margin:0}
.rc-sub{margin:8px 0 0;font-size:14px;color:var(--ink-4)}
.rc-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.rc-pills{display:inline-flex;background:rgba(10,10,10,.04);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.rc-pills button{border:0;background:transparent;font:500 12px 'Poppins',sans-serif;color:var(--ink-4);padding:8px 16px;cursor:pointer;border-radius:999px;white-space:nowrap;transition:all .2s}
.rc-pills button:hover{color:var(--ink)}
.rc-pills button.on{background:var(--ink);color:#fafaf6;box-shadow:0 2px 8px rgba(10,10,10,.15)}
.rc-date{background:var(--card);border:0;border-radius:999px;padding:10px 16px;font:500 12px 'Poppins',sans-serif;color:var(--ink);box-shadow:var(--shadow)}
.rc-btn{border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font:500 12px 'Poppins',sans-serif;cursor:pointer;box-shadow:var(--shadow);transition:all .2s}
.rc-btn:hover{transform:translateY(-1px)}

.rc-tabs{display:inline-flex;gap:4px;margin-bottom:28px;background:rgba(10,10,10,.04);padding:5px;border-radius:999px;max-width:100%;overflow-x:auto}
.rc-tab{background:transparent;border:0;font:500 13px 'Poppins',sans-serif;color:var(--ink-4);padding:10px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:all .2s}
.rc-tab:hover{color:var(--ink)}
.rc-tab.on{background:var(--grad-ink);color:#fafaf6;box-shadow:0 4px 14px rgba(10,10,10,.20)}
.rc-tab i{font:600 11px 'Poppins',sans-serif;font-style:normal;background:var(--neg);color:#fff;border-radius:999px;padding:1px 8px}

/* summary cards: the two systems side by side, in words */
.rc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:24px}
.rc-kpi{background:var(--card);border-radius:20px;padding:24px 28px;box-shadow:var(--shadow)}
.rc-kpi__label{font:500 11px 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:1.8px;color:var(--ink-mute);margin-bottom:16px}
.rc-kpi__pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rc-kpi__side small{display:block;font:500 11px 'Poppins',sans-serif;color:var(--ink-mute);margin-bottom:2px}
.rc-kpi__side b{font:600 34px/1 'Poppins',sans-serif;color:var(--ink);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.rc-kpi__side.is-e b{color:var(--avo-700)}
.rc-kpi__foot{margin-top:16px}
.rc-kpi--wide{grid-column:1/-1}
.rc-kpi--wide .rc-kpi__pair{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px 40px}
.rc-warnnum{color:#96650f}.rc-badnum{color:var(--neg)}
.rc-spectable{width:100%;border-collapse:collapse;font-size:13px}.rc-spectable th{text-align:left;padding:10px 14px;color:var(--ink-mute);font:500 11px 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:1px}.rc-spectable td{padding:10px 14px;border-top:1px solid rgba(10,10,10,.06);vertical-align:top}.rc-spectable td b{font-weight:600}
.rc-cur{white-space:nowrap}.rc-cur i{font-style:normal;font-size:11px;color:var(--ink-mute);margin-right:4px}
.rc-kpi__sub{margin-top:6px;font:500 12px 'Poppins',sans-serif;color:var(--ink-mute)}
.rc-amts{display:flex;flex-wrap:wrap;gap:6px 24px}
.rc-amts b{font:600 26px/1.15 'Poppins',sans-serif;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-amts b i{font:500 12px 'Poppins',sans-serif;font-style:normal;color:var(--ink-mute);letter-spacing:.4px;margin-right:6px}
.rc-kpi--wide .rc-kpi__side.is-e .rc-amts b{color:var(--avo-700)}

.rc-card{background:var(--card);border-radius:24px;padding:8px 8px 12px;box-shadow:var(--shadow);margin-bottom:18px}
.rc-card__head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px 6px}
.rc-card__head h3{margin:0;font:600 17px 'Poppins',sans-serif;color:var(--ink);letter-spacing:-.3px}
.rc-card__head span{font:500 12px 'Poppins',sans-serif;color:var(--ink-mute)}

/* the comparison grid: Rosenta on the left, ERPNext on the right, one status at the end */
.rc-scroll{overflow-x:auto;padding:0 14px}
.rc-g{display:grid;grid-template-columns:var(--cols);align-items:center;min-width:var(--minw,0)}
.rc-g>div{padding:11px 10px;min-width:0}
.rc-g .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.rc-g .n.dim{color:var(--ink-faint);font-weight:400}
.rc-g .sep{border-left:1px solid var(--hair)}
.rc-gh{font:500 10.5px 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-mute)}
.rc-gh>div{padding-top:6px;padding-bottom:10px}
.rc-grp{padding-bottom:0!important}
.rc-grp span{display:inline-block;font:600 11px 'Poppins',sans-serif;letter-spacing:.6px;text-transform:none;padding:4px 12px;border-radius:999px}
.rc-grp .r{background:var(--ink);color:#fafaf6}
.rc-grp .e{background:var(--avo-600);color:#fff}
.rc-gh .sub-r{color:var(--ink)}.rc-gh .sub-e{color:var(--avo-600)}
.rc-grp .s{background:rgba(10,10,10,.05);color:var(--ink-4)}
.rc-row{border-top:1px solid var(--hair);transition:background .15s}
.rc-row.go{cursor:pointer}
.rc-row.go:hover{background:rgba(10,10,10,.025);border-radius:12px}
.rc-row.total{border-top:0}
.rc-row.total>div{padding-top:12px;padding-bottom:12px}.rc-row.total{background:rgba(10,10,10,.03);border-radius:12px;border-top:0;margin-top:4px}.rc-row.total .rc-name{font-weight:600}
.rc-name{font:600 14px 'Poppins',sans-serif;color:var(--ink);overflow-wrap:anywhere}
.rc-name small{display:block;font:400 12px 'Poppins',sans-serif;color:var(--ink-mute);margin-top:1px}
.rc-arrow{color:var(--ink-faint);margin-left:6px;font-weight:400}
.rc-row.go:hover .rc-arrow{color:var(--ink)}
.rc-time b{display:block;font:600 14px 'Poppins',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.rc-time small{display:block;white-space:nowrap;font:400 11px 'Poppins',sans-serif;color:var(--ink-mute)}
.rc-none{color:var(--ink-faint)}

.rc-chip{display:inline-block;padding:3px 11px;font:500 11.5px 'Poppins',sans-serif;border-radius:999px;white-space:nowrap;background:rgba(10,10,10,.05);color:var(--ink-4)}
.rc-chip.good{background:rgba(122,162,63,.14);color:var(--avo-700)}
.rc-chip.warn{background:rgba(217,150,46,.14);color:#96650f}
.rc-chip.bad{background:rgba(196,48,43,.10);color:var(--neg)}
.rc-diff.good{color:var(--avo-600)}.rc-diff.warn{color:#96650f}.rc-diff.bad{color:var(--neg)}

.rc-switch{margin:4px 0 16px}
.rc-hint{margin:6px 4px 0;color:var(--ink-mute);font-size:12px;max-width:900px}
.rc-note{background:var(--card);border-radius:16px;padding:14px 20px;box-shadow:var(--shadow);margin-bottom:18px;font-size:13px}
.rc-note.bad{color:var(--neg)}.rc-note.good{color:var(--avo-700)}.rc-note.warn{color:#96650f}
.rc-empty{padding:44px 20px;text-align:center;color:var(--ink-mute)}
.rc-empty b{display:block;color:var(--ink);font:600 15px 'Poppins',sans-serif;margin-bottom:4px}
.rc-skel{height:56px;border-radius:14px;background:linear-gradient(90deg,rgba(10,10,10,.04),rgba(10,10,10,.08),rgba(10,10,10,.04));margin:8px 14px}

/* the side panel */
.rc-veil{position:fixed;inset:0;background:rgba(10,10,10,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.rc-veil.on{opacity:1;pointer-events:auto}
.rc-panel{position:fixed;top:0;right:0;bottom:0;width:min(980px,94vw);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-24px 0 48px -24px rgba(10,10,10,.25)}
.rc-panel.on{transform:none}
.rc-panel__head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:26px 30px 18px;background:var(--card);border-bottom:1px solid var(--hair)}
.rc-panel__head h2{margin:0;font:600 24px/1.15 'Poppins',sans-serif;color:var(--ink);letter-spacing:-.6px}
.rc-panel__head p{margin:4px 0 0;font-size:13px;color:var(--ink-mute)}
.rc-x{width:38px;height:38px;border:0;border-radius:50%;background:rgba(10,10,10,.05);color:var(--ink-4);font-size:20px;line-height:1;cursor:pointer;flex:none}
.rc-x:hover{background:var(--ink);color:#fafaf6}
.rc-panel__body{overflow-y:auto;padding:22px 30px 40px;flex:1}
.rc-orderhead{border-top:1px solid var(--hair);margin-top:10px}
.rc-orderhead>div{padding:14px 10px 4px!important}
.rc-whos{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.rc-who small{display:inline-block;font:600 10.5px 'Poppins',sans-serif;text-transform:uppercase;letter-spacing:1.2px;padding:2px 10px;border-radius:999px;background:var(--ink);color:#fafaf6;margin-bottom:4px}
.rc-who.e small{background:var(--avo-600)}
.rc-who b{display:block;font:600 13px 'Poppins',sans-serif;color:var(--ink);overflow-wrap:anywhere}
.rc-who span{display:block;font-size:12px;color:var(--ink-mute)}
.rc-mixed{display:block;font:400 11.5px 'Poppins',sans-serif;color:var(--ink-mute);margin-top:3px}
.rc-lenrow{display:block;font:400 11.5px 'Poppins',sans-serif;color:var(--ink-mute);margin-top:2px}

@media (max-width:760px){.rc-top{padding:12px 16px}.rc-page{padding:24px 16px 60px}.rc-title{font-size:30px}.rc-panel__body{padding:18px 16px 32px}.rc-panel__head{padding:20px 16px 14px}}
</style>
<script>document.documentElement.classList.add('rc-root');</script>
<div class="rc" id="rc">
  <div class="rc-top">
    <div class="rc-top__mark">U</div>
    <div class="rc-top__name">Upande<small>Rosenta comparison</small></div>
    <div class="rc-top__right"><span id="rc-updated"></span><button class="rc-btn" id="rc-refresh" type="button">Refresh</button></div>
  </div>
  <div class="rc-page">
    <header class="rc-head">
      <div>
        <div class="rc-eyebrow">Rosenta · ERPNext</div>

<div class="rc-veil" id="rc-veil"></div>
<aside class="rc-panel" id="rc-panel" aria-hidden="true">
  <div class="rc-panel__head"><div><h2 id="rc-p-title"></h2><p id="rc-p-sub"></p></div><button class="rc-x" id="rc-p-close" type="button" aria-label="Close">&times;</button></div>
  <div class="rc-panel__body" id="rc-p-body"></div>
</aside>
</div>

<script>
(function () {
  "use strict";
  var LAG_RED_MIN = 60; // a team this many minutes behind is flagged
  var POLL_MS = 120000;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  function boot() {
    if (!(window.PH && PH.call && PH.csv)) return setTimeout(boot, 30);
    start();
  }

  function start() {
    var iso = function (d) { return d.toLocaleDateString("en-CA", { timeZone: "Africa/Nairobi" }); };
    var today = new Date();
    var st = { date: iso(today), tab: "orders", show: "diff", span: "1" };
    var rdata = {}, rkey = {}, rseq = 0; // Money, Greenhouses and Fill rate: their own period and data
    var data = null, seq = 0;

    // ---- numbers and times (whole numbers everywhere; a pack rate is stems in one box)
    function num(x) { return x == null ? "—" : Math.round(x).toLocaleString("en-US"); }
    function money(x, dp) { return x == null ? "—" : Number(x).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
    var m2 = function (v) { return money(v, 2); }, m3 = function (v) { return money(v, 3); };
    function ts(epoch) { return epoch ? new Date(epoch * 1000) : null; }
    function erpTs(s) { return s && s !== "None" ? new Date(String(s).replace(" ", "T").slice(0, 19) + "+03:00") : null; }
    function clock(d) { return d.toLocaleTimeString("en-GB", { timeZone: "Africa/Nairobi", hour: "2-digit", minute: "2-digit", hour12: false }); }
    function dayLabel(d, now) {
      if (iso(d) === iso(now)) return "Today";
      if (iso(d) === iso(new Date(now.getTime() - 86400000))) return "Yesterday";
      return d.toLocaleDateString("en-GB", { timeZone: "Africa/Nairobi", day: "2-digit", month: "short" });
    }
    function span(mins) { var a = Math.abs(Math.round(mins)); return a >= 60 ? Math.floor(a / 60) + " h " + (a % 60) + " m" : a + " m"; }
    function longDate(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
    function timeCell(d, now) {
      return d ? '<div class="rc-time"><b>' + clock(d) + "</b><small>" + dayLabel(d, now) + " · " + span((now - d) / 60000) + " ago</small></div>" : '<span class="rc-none">no entry</span>';
    }

    // ---- difference, always ERPNext against Rosenta, in words
    function tone(a, b) {
      if (a == null || b == null) return "";
      var d = b - a;
      if (d === 0) return "good";
      return Math.abs(d) / (Math.max(Math.abs(a), Math.abs(b)) || 1) > 0.1 ? "bad" : "warn";
    }
    function gapChip(a, b, unit) {
      if (a == null && b == null) return '<span class="rc-none">—</span>';
      if (a == null) return '<span class="rc-chip bad">Only in ERPNext</span>';
      if (b == null) return '<span class="rc-chip bad">Only in Rosenta</span>';
      var d = b - a;
      if (d === 0) return '<span class="rc-chip good">Matches</span>';
      return '<span class="rc-chip ' + tone(a, b) + '">ERPNext ' + num(Math.abs(d)) + (unit ? " " + unit : "") + (d < 0 ? " less" : " more") + "</span>";
    }
    function statusChip(status, a, b) {
      if (status === "Matches") return '<span class="rc-chip good">Matches</span>';
      if (String(status).indexOf("Only") === 0) return '<span class="rc-chip bad">' + esc(status) + "</span>";
      return '<span class="rc-chip ' + (tone(a, b) || "warn") + '">' + esc(status) + "</span>";
    }

    // ---- the grid. cols: [{k, h, side:'r'|'e'|'s', w, html, text}], rows: [{name, sub, r, e, status, go, i}]
    function grid(o) {
      var cols = o.cols;
      var tpl = (o.firstW || "minmax(210px,1.8fr)") + " " + cols.map(function (c) { return c.w || "minmax(78px,1fr)"; }).join(" ");
      var minw = o.minw || 0;
      var groups = [], last = null;
      var gk = function (c) { return c.grp || c.side; };
      cols.forEach(function (c) { if (last && last.key === gk(c)) last.n++; else { last = { key: gk(c), side: c.grp ? "s" : c.side, n: 1, label: c.grp || (c.side === "r" ? "Rosenta" : c.side === "e" ? "ERPNext" : (o.statusLabel || "Status")) }; groups.push(last); } });
      var subHead = function (c) { return c.grp ? (c.side === "r" ? "Rosenta" : "ERPNext") : c.h; };
      var h = '<div class="rc-g rc-gh" style="--cols:' + tpl + ";--minw:" + minw + 'px"><div class="rc-grp"></div>' +
        groups.map(function (g) { return '<div class="rc-grp sep" style="grid-column:span ' + g.n + '"><span class="' + g.side + '">' + g.label + "</span></div>"; }).join("") +
        "</div>" +
        '<div class="rc-g rc-gh" style="--cols:' + tpl + ";--minw:" + minw + 'px"><div>' + esc(o.first || "") + "</div>" +
        cols.map(function (c, i) { var sep = i === 0 || gk(cols[i - 1]) !== gk(c); return '<div class="' + (c.text || c.html ? "" : "n") + (sep ? " sep" : "") + (c.grp ? " sub-" + c.side : "") + '">' + esc(subHead(c)) + "</div>"; }).join("") + "</div>";
      o.rows.forEach(function (r) {

      if (!data) return;
      var rows = [];
      var add = function (section, c, k, label, status) { rows.push({ section: section, customer: c.customer, measure: label, rosenta: c.rosenta[k], erpnext: c.erpnext[k], difference: c.rosenta[k] == null || c.erpnext[k] == null ? "" : c.erpnext[k] - c.rosenta[k], status: status }); };
      data.customers.forEach(function (c) {
        [["orders", "Orders"], ["boxes", "Boxes"], ["stems", "Stems"]].forEach(function (k) { add("Orders", c, k[0], k[1], c.orders_status); });
        [["value", "Order value"], ["price", "Price per stem"]].forEach(function (k) { add("Prices (" + (c.erpnext.currency || c.rosenta.currency || "") + ")", c, k[0], k[1], ""); });
        rows.push({ section: "Dispatch", customer: c.customer, measure: "Delivery notes", rosenta: "", erpnext: c.erpnext.delivery_notes, difference: "", status: "" });
        if (c.dispatch_status !== "-") [["orders_dispatched", "Orders dispatched"], ["stems_dispatched", "Stems dispatched"]].forEach(function (k) { add("Dispatch", c, k[0], k[1], c.dispatch_status); });
        if (c.invoice_status !== "-") [["orders_invoiced", "Orders invoiced"], ["invoices", "Invoices"]].forEach(function (k) { add("Invoicing", c, k[0], k[1], c.invoice_status); });
        if (c.pack_status !== "-") [["boxes_packed", "Boxes packed"], ["boxes_staged", "Boxes staged"], ["boxes_loaded", "Boxes loaded"], ["stems_packed", "Stems packed"], ["stems_loaded", "Stems loaded"]].forEach(function (k) { add("Packing", c, k[0], k[1], c.pack_status); });
      });
      PH.csv("rosenta-comparison-" + data.date + ".csv", rows, [
        { key: "section", label: "Section" }, { key: "customer", label: "Customer" }, { key: "measure", label: "Measure" },
        { key: "rosenta", label: "Rosenta" }, { key: "erpnext", label: "ERPNext" }, { key: "difference", label: "Difference (ERPNext minus Rosenta)" }, { key: "status", label: "Status" }]);
    });

    paintTabs();
    load();
  }

  boot();
})();
</script>
