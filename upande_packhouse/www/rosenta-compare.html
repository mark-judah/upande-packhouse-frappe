{% extends "templates/web.html" %}
{% block title %}Rosenta comparison{% endblock %}
{% block page_content %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/upande_packhouse/css/packhouse-v2.css?v={{ ph_v }}">
<style>
/* Layout only, from the shared tokens. The page has no sidebar. */
/* Layout only, v2 tokens only. */
tr.rc-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.rc-warn td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
.rc-when b{display:block;font:600 15px var(--mono)}
.rc-when small{display:block;font-size:12px;color:var(--ink-mute);margin-top:2px}
.rc-sub{font-size:12px;color:var(--ink-mute);margin-top:2px;font-weight:400;display:block}
.rc-card-gap{margin-bottom:var(--sp-6)}
.rc-detail{min-width:560px}
.ph2.rc-solo{grid-template-columns:minmax(0,1fr)}

/* Stacked comparison: every item is a block of three rows (Rosenta, ERPNext, Difference) under one set of headings. */
.rc-cmp tbody.rc-block{border-bottom:1px solid var(--hairline-2)}
.rc-cmp tbody.rc-block td{border-bottom:0;padding-top:var(--sp-2);padding-bottom:var(--sp-2)}
.rc-cmp tbody.rc-block.is-link{cursor:pointer}
.rc-cmp tbody.rc-block.is-link:hover td{background:var(--tint-2)}
.rc-cmp tbody.rc-block.is-link:hover tr.rc-diffrow td{background:var(--tint)}
.rc-cmp .rc-title{vertical-align:top;min-width:220px;padding-top:var(--sp-3)}
.rc-cmp .rc-title b{font-weight:600}
.rc-cmp .rc-title small{display:block;margin-top:2px;font-weight:400;color:var(--ink-mute)}
.rc-cmp .rc-sys{color:var(--ink-4);white-space:nowrap}
.rc-cmp .rc-status{vertical-align:middle;white-space:nowrap}
.rc-cmp tr.rc-diffrow td{background:var(--tint);font-weight:600}
.rc-cmp tr.rc-diffrow .rc-sys{color:var(--ink)}
.rc-cmp .rc-zero{color:var(--good)}
.rc-cmp .rc-small{color:var(--warn)}
.rc-cmp .rc-big{color:var(--bad)}
.rc-cmp tbody.rc-bad td.rc-title{box-shadow:inset 3px 0 0 var(--bad)}
.rc-cmp tbody.rc-warn td.rc-title{box-shadow:inset 3px 0 0 #f59e0b}
.rc-cmp tbody.rc-orderhead td{background:var(--surface-2);padding:var(--sp-4) var(--sp-4) var(--sp-2);border-top:1px solid var(--hairline-3);border-bottom:0;white-space:normal}
.rc-cmp tbody.rc-orderhead b{font-weight:600}
.rc-cmp td.rc-text{text-align:left;white-space:normal;color:var(--ink-4);font-size:12px;max-width:190px}
.rc-pills-row{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-5) 0 var(--sp-3)}
.rc-hint{margin:var(--sp-2) 0 var(--sp-4);color:var(--ink-mute);font-size:12px}
.rc-cmp tbody.rc-block td.rc-sys{padding-left:var(--sp-4)}
.rc-cmp tbody.rc-block td.rc-title{padding-left:var(--sp-6)}
.rc-cmp td.rc-last{max-width:none;font-size:inherit;color:var(--ink);white-space:nowrap}
</style>
<script>document.documentElement.classList.add('ph2-root');</script>
<div class="ph2 rc-solo" id="ph2">
  <main class="ph-main" id="ph-main">
    <div class="ph-topbar">
      <div class="ph-topbar__crumb"><b>Rosenta comparison</b></div>
      <div class="ph-topbar__right">
        <span class="ph-updated" id="ph-updated" hidden></span>
        <button class="ph-iconbtn ph-iconbtn--sm" id="ph-refresh" title="Refresh" aria-label="Refresh" hidden><svg class="ph-ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      </div>
    </div>
    <div class="ph-page">
<header class="ph-head">
  <div>
    <div class="ph-head__eyebrow">Rosenta · ERPNext</div>
    <h1 class="ph-head__title">Rosenta comparison</h1>
    <p class="ph-head__sub" id="rc-sub">Rosenta compared with ERPNext for one delivery date.</p>
  </div>
  <div class="ph-head__tools"><button class="ph-btn ph-btn--sm" id="rc-csv" type="button">Download CSV</button></div>
</header>

<div class="ph-filters">
  <div class="ph-pills" id="rc-presets"><button type="button" data-value="yesterday">Yesterday</button><button type="button" data-value="today">Today</button><button type="button" data-value="tomorrow">Tomorrow</button></div>
  <div class="ph-daterange"><input type="date" id="rc-date" aria-label="Delivery date"></div>
</div>

<div class="ph-tabs" id="rc-tabs" role="tablist">
  <button class="ph-tab" type="button" data-tab="orders">Orders<span class="ph-tab__count" id="rc-n-orders" hidden></span></button>
  <button class="ph-tab" type="button" data-tab="packing">Packing<span class="ph-tab__count" id="rc-n-packing" hidden></span></button>
  <button class="ph-tab" type="button" data-tab="teams">Teams</button>
  <button class="ph-tab" type="button" data-tab="cancel">Cancellations<span class="ph-tab__count" id="rc-n-cancel" hidden></span></button>
</div>

<div id="rc-warn"></div>
<div id="rc-content"></div>
    </div>
  </main>
</div>
<script src="/assets/upande_packhouse/js/packhouse-v2.js?v={{ ph_v }}"></script>
{% raw %}
<script>
(function () {
  "use strict";
  var LAG_RED_MIN = 60; // a team this many minutes behind is flagged
  var POLL_MS = 120000;

  function boot() {
    if (!(window.PH && PH.table && PH.state && PH.modal)) return setTimeout(boot, 30);
    start();
  }

  function start() {
    var st = PH.state({ date: PH.date.today(), tab: "orders", show: "diff" });
    var data = null, seq = 0;
    var $ = function (id) { return document.getElementById(id); };
    var esc = PH.esc;

    // ---- numbers and times
    function num(x, dp) { return x == null ? "—" : dp ? PH.fmt.qty(x, dp) : PH.fmt.num(x); }
    function signed(x) { x = Number(x || 0); return (x > 0 ? "+" : x < 0 ? "−" : "") + PH.fmt.qty(Math.abs(x), 1); }
    function ts(epoch) { return epoch ? new Date(epoch * 1000) : null; }
    function erpTs(s) { return s && s !== "None" ? new Date(String(s).replace(" ", "T").slice(0, 19) + "+03:00") : null; }
    function clock(d) { return d.toLocaleTimeString("en-GB", { timeZone: "Africa/Nairobi", hour: "2-digit", minute: "2-digit", hour12: false }); }
    function dayLabel(d, now) {
      var f = function (x) { return x.toLocaleDateString("en-CA", { timeZone: "Africa/Nairobi" }); };
      if (f(d) === f(now)) return "Today";
      if (f(d) === f(new Date(now.getTime() - 86400000))) return "Yesterday";
      return d.toLocaleDateString("en-GB", { timeZone: "Africa/Nairobi", day: "2-digit", month: "short" });
    }
    function span(mins) {
      var a = Math.abs(Math.round(mins));
      return a >= 60 ? Math.floor(a / 60) + " h " + (a % 60) + " m" : a + " m";
    }
    function when(d, now) {
      if (!d) return '<span class="ph-muted">no entry</span>';
      return '<div class="rc-when"><b>' + clock(d) + "</b><small>" + dayLabel(d, now) + " · " + span((now - d) / 60000) + " ago</small></div>";
    }

    // ---- the one comparison pattern: a block of three rows (Rosenta, ERPNext, Difference)
    function tone(a, b) { // how far apart two numbers are
      if (a == null || b == null) return "";
      var d = b - a;
      if (d === 0) return "rc-zero";
      return Math.abs(d) / (Math.max(Math.abs(a), Math.abs(b)) || 1) > 0.1 ? "rc-big" : "rc-small";
    }
    function statusFor(a, b) { return a === b ? "Matches" : b < a ? "ERPNext lower" : "Rosenta lower"; }
    function badge(status, a, b) {
      var cls = "ph-badge--outline";
      if (status === "Matches") cls = "ph-badge--good";
      else if (status.indexOf("Only") === 0) cls = "ph-badge--bad";
      else if (status !== "-") cls = tone(a, b) === "rc-big" ? "ph-badge--bad" : "ph-badge--warn";
      return '<span class="ph-badge ' + cls + '">' + esc(status) + "</span>";
    }
    function blockTone(status, a, b) {
      if (status === "Matches" || status === "-") return "";
      if (status.indexOf("Only") === 0) return "rc-bad";
      return tone(a, b) === "rc-big" ? "rc-bad" : "rc-warn";
    }
    // a column is [key, heading, kind]; kind "text" shows the value as it is and has no difference
    function cell(col, side) {
      if (!side) return '<td class="is-num ph-muted">—</td>';
      var v = col.value ? col.value(side) : side[col.key];
      if (col.html) return '<td class="rc-text rc-last">' + (v || '<span class="ph-muted">—</span>') + "</td>";
      if (col.text) return '<td class="rc-text">' + esc(v == null || v === "" ? "—" : v) + "</td>";
      return '<td class="is-num">' + num(v, col.dp) + "</td>";
    }
    function diffCell(col, r, e) {
      if (col.diff) return '<td class="rc-text rc-last">' + (col.diff(r, e) || "") + "</td>";
      if (col.text) return "<td></td>";
      var a = r && (col.value ? col.value(r) : r[col.key]), b = e && (col.value ? col.value(e) : e[col.key]);
      if (!r || !e || a == null || b == null) return '<td class="is-num ph-muted">—</td>';
      return '<td class="is-num ' + tone(a, b) + '">' + signed(Math.round((b - a) * 10) / 10) + "</td>";
    }
    function block(o) { // {index, title, sub, rosenta, erpnext, cols, statusHtml, tone, link}
      var c = o.cols;
      return '<tbody class="rc-block ' + (o.tone || "") + (o.link ? " is-link" : "") + '" data-i="' + (o.index == null ? "" : o.index) + '">' +
        '<tr><td class="rc-title" rowspan="3"><b>' + esc(o.title) + "</b>" + (o.sub ? "<small>" + esc(o.sub) + "</small>" : "") + '</td><td class="rc-sys">Rosenta</td>' +
        c.map(function (k) { return cell(k, o.rosenta); }).join("") + (o.statusHtml != null ? '<td class="rc-status" rowspan="3">' + o.statusHtml + "</td>" : "") + "</tr>" +
        '<tr><td class="rc-sys">ERPNext</td>' + c.map(function (k) { return cell(k, o.erpnext); }).join("") + "</tr>" +
        '<tr class="rc-diffrow"><td class="rc-sys">Difference</td>' + c.map(function (k) { return diffCell(k, o.rosenta, o.erpnext); }).join("") + "</tr></tbody>";
    }
    function table(firstHeading, cols, bodies, withStatus) {
      return '<div class="ph-table-wrap"><table class="ph-table rc-cmp"><thead><tr><th>' + esc(firstHeading) + "</th><th></th>" +
        cols.map(function (c) { return '<th class="' + (c.text ? "" : "is-num") + '">' + esc(c.heading) + "</th>"; }).join("") +
        (withStatus === false ? "" : "<th>Status</th>") + "</tr></thead>" + bodies + "</table></div>";
    }
    function rate(side) { return side.boxes ? Math.round((side.stems / side.boxes) * 10) / 10 : null; }

    var ORDER_COLS = [
      { key: "orders", heading: "Orders" },
      { key: "boxes", heading: "Boxes" },
      { key: "stems", heading: "Stems" },
      { key: "rate", heading: "Pack rate", value: rate, dp: 1 }
    ];
    var PACK_COLS = [
      { key: "boxes_packed", heading: "Boxes packed" },
      { key: "boxes_staged", heading: "Boxes staged" },
      { key: "boxes_loaded", heading: "Boxes loaded" },
      { key: "stems_packed", heading: "Stems packed" },
      { key: "stems_loaded", heading: "Stems loaded" }
    ];

    function showPills() {
      var on = st.get("show");
      return '<div class="rc-pills-row"><div class="ph-pills" id="rc-show">' +
        '<button type="button" data-value="diff"' + (on === "diff" ? ' class="is-on"' : "") + ">Differences only</button>" +
        '<button type="button" data-value="all"' + (on === "all" ? ' class="is-on"' : "") + ">All customers</button></div></div>";
    }
    function card(inner, extra) { return '<section class="ph-card ph-card--flush ' + (extra || "") + '">' + inner + "</section>"; }
    function cardTitle(t) { return '<div class="ph-card__head"><div class="ph-card__title">' + esc(t) + "</div></div>"; }

    // ---- orders
    function ordersView() {
      var t = data.totals;
      var all = block({ title: "All customers", rosenta: t.rosenta, erpnext: t.erpnext, cols: ORDER_COLS,
        statusHtml: badge(statusFor(t.rosenta.boxes, t.erpnext.boxes), t.rosenta.boxes, t.erpnext.boxes) });
      var list = data.customers.map(function (c, i) { return { c: c, i: i, gap: Math.abs(c.erpnext.boxes - c.rosenta.boxes) }; })
        .sort(function (a, b) { return b.gap - a.gap; })
        .filter(function (x) { return st.get("show") === "all" || (x.c.orders_status !== "Matches" && x.c.orders_status !== "-"); });
      var bodies = list.map(function (x) {
        var c = x.c;
        return block({ index: x.i, title: c.customer, rosenta: c.rosenta, erpnext: c.erpnext, cols: ORDER_COLS, link: true,
          statusHtml: badge(c.orders_status, c.rosenta.boxes, c.erpnext.boxes), tone: blockTone(c.orders_status, c.rosenta.boxes, c.erpnext.boxes) });
      }).join("");
      $("rc-content").innerHTML = card(table("", ORDER_COLS, all), "rc-card-gap") + showPills() +
        (list.length ? card(table("Customer", ORDER_COLS, bodies)) : card('<div class="ph-empty"><div class="ph-empty__title">No differences</div><div class="ph-empty__text">Every customer matches for this date.</div></div>')) +
        '<p class="rc-hint">Click a customer to see its orders, line by line. Boxes are boxes ordered. Pack rate is stems per box. Difference is ERPNext minus Rosenta, so a minus means ERPNext has less.</p>';
    }

    var LINE_COLS = [
      { key: "boxes", heading: "Boxes" },
      { key: "pack_rate", heading: "Pack rate" },
      { key: "stems", heading: "Stems" },
      { key: "length", heading: "Length", text: true, value: function (s) { return typeof s.length === "number" ? (s.length ? s.length + " cm" : "") : s.length; } },
      { key: "box_type", heading: "Box type", text: true }
    ];
    function orderDetail(c) {
      var h = '<div class="ph-table-wrap"><table class="ph-table rc-cmp"><thead><tr><th>Line</th><th></th>' +
        LINE_COLS.map(function (k) { return '<th class="' + (k.text ? "" : "is-num") + '">' + esc(k.heading) + "</th>"; }).join("") + "</tr></thead>";
      c.pairs.forEach(function (p) {
        var r = p.rosenta, e = p.erpnext;
        var head = (r ? "<b>Rosenta</b> " + esc(r.name) + " · " + esc(r.status) : "<b>Rosenta</b> not found") + " &nbsp;&nbsp;|&nbsp;&nbsp; " +
          (e ? "<b>ERPNext</b> " + esc(e.name) + " · " + esc(e.so) + " · " + esc(e.status) : "<b>ERPNext</b> not found");
        h += '<tbody class="rc-orderhead"><tr><td colspan="' + (LINE_COLS.length + 2) + '">' + head + "</td></tr></tbody>";
        var tot = function (s) { return s && { boxes: s.boxes, stems: s.stems, pack_rate: s.boxes ? Math.round((s.stems / s.boxes) * 10) / 10 : null, length: "", box_type: "" }; };
        h += block({ title: "Whole order", rosenta: tot(r), erpnext: tot(e), cols: LINE_COLS });
        p.lines.forEach(function (l) { h += block({ title: l.label, rosenta: l.rosenta, erpnext: l.erpnext, cols: LINE_COLS }); });
      });
      h += "</table></div>";
      h += '<p class="rc-hint">ERPNext often splits one Rosenta order over several Sales Orders, so a line shown as missing may be in another ERPNext order further down. In ERPNext a mixed box repeats its box count on each colour line.</p>';
      PH.modal({ title: c.customer, sub: "Orders for " + PH.fmt.date(data.date) + ". Difference is ERPNext minus Rosenta.", size: "xl", body: h });
    }

    // ---- packing
    function packingView() {
      var t = data.totals;
      var rows = data.customers.map(function (c, i) { return { c: c, i: i, gap: Math.abs(c.erpnext.stems_packed - c.rosenta.stems_packed) }; })
        .filter(function (x) { return x.c.pack_status !== "-"; })
        .sort(function (a, b) { return b.gap - a.gap; })
        .filter(function (x) { return st.get("show") === "all" || x.c.pack_status !== "Matches"; });
      var all = block({ title: "All customers", rosenta: t.rosenta, erpnext: t.erpnext, cols: PACK_COLS,
        statusHtml: badge(statusFor(t.rosenta.stems_packed, t.erpnext.stems_packed), t.rosenta.stems_packed, t.erpnext.stems_packed) });
      var bodies = rows.map(function (x) {
        var c = x.c;
        return block({ title: c.customer, rosenta: c.rosenta, erpnext: c.erpnext, cols: PACK_COLS,
          statusHtml: badge(c.pack_status, c.rosenta.stems_packed, c.erpnext.stems_packed), tone: blockTone(c.pack_status, c.rosenta.stems_packed, c.erpnext.stems_packed) });
      }).join("");
      var warn = data.ops_error ? '<div class="ph-notice ph-notice--bad ph-mb">Rosenta Packhouse Operations could not be read, so Rosenta boxes are not shown: ' + esc(data.ops_error) + "</div>" : "";
      $("rc-content").innerHTML = warn + card(table("", PACK_COLS, all), "rc-card-gap") + showPills() +
        (rows.length ? card(table("Customer", PACK_COLS, bodies)) : card('<div class="ph-empty"><div class="ph-empty__title">Nothing to show</div><div class="ph-empty__text">No packing differences for this date.</div></div>')) +
        '<p class="rc-hint">Rosenta reports staged stems, and boxes are staged straight after packing, so its staged stems stand for stems packed. Status compares stems packed. ERPNext records staging and loading only for Bravo, so its staged and loaded figures are 0 for the other teams. Difference is ERPNext minus Rosenta.</p>';
    }

    // ---- teams
    var TEAM_COLS = [
      { key: "assigned", heading: "Boxes to pack" },
      { key: "packed", heading: "Boxes packed" },
      { key: "staged", heading: "Boxes staged" },
      { key: "loaded", heading: "Boxes loaded" }
    ];
    function teamsView() {
      var now = erpTs(data.fetched) || new Date();
      var mapped = [], loose = [];
      data.teams.forEach(function (t) {
        var r = t.rosenta, e = t.erpnext;
        var rt = r ? ts(r.last_packed) : null, et = e ? erpTs(e.last_pack) : null;
        var o = { t: t, rt: rt, et: et, behind: rt && et ? Math.round((rt - et) / 60000) : null };
        (t.erp_teams === "(not mapped)" || t.team === "(not mapped)" ? loose : mapped).push(o);
      });
      mapped.sort(function (x, y) { return (y.behind == null ? -1e9 : y.behind) - (x.behind == null ? -1e9 : x.behind); });
      var late = mapped.filter(function (o) { return o.behind != null && o.behind >= LAG_RED_MIN; }).length;
      function lastBox(d) {
        return d ? '<div class="rc-when"><b>' + clock(d) + "</b><small>" + dayLabel(d, now) + " · " + span((now - d) / 60000) + " ago</small></div>" : "";
      }
      function behindHtml(r, e) {
        if (!r || !e || r.rt == null || e.et == null) return "";
        var m = Math.round((r.rt - e.et) / 60000);
        if (m > 0) return '<span class="ph-badge ' + (m >= LAG_RED_MIN ? "ph-badge--bad" : "ph-badge--warn") + '">ERPNext is ' + span(m) + " behind</span>";
        if (m < 0) return '<span class="ph-badge ph-badge--outline">ERPNext is ' + span(m) + " ahead</span>";
        return '<span class="ph-badge ph-badge--good">Level</span>';
      }
      var cols = TEAM_COLS.concat([{ key: "last", heading: "Last box packed", html: true, value: function (s) { return s.last_html; }, diff: behindHtml }]);
      function sides(o) {
        var r = o.t.rosenta, e = o.t.erpnext;
        return {
          rosenta: r && { assigned: r.assigned, packed: r.packed, staged: r.staged, loaded: r.loaded, rt: o.rt, last_html: lastBox(o.rt) },
          erpnext: e && { assigned: e.expected, packed: e.packed, staged: null, loaded: null, et: o.et, last_html: lastBox(o.et) }
        };
      }
      function teamBlock(o) {
        var s = sides(o);
        return block({ title: o.t.team, sub: "ERPNext team: " + o.t.erp_teams, rosenta: s.rosenta, erpnext: s.erpnext, cols: cols,
          tone: o.behind != null && o.behind >= LAG_RED_MIN ? "rc-bad" : "" });
      }
      var warn = data.ops_error ? '<div class="ph-notice ph-notice--bad ph-mb">Rosenta Packhouse Operations could not be read, so Rosenta boxes by team are not shown: ' + esc(data.ops_error) + "</div>" : "";
      var h = warn + '<div class="ph-notice ph-notice--' + (late ? "warn" : "good") + ' ph-mb">Now ' + clock(now) + ". " + late + " of " + mapped.length + " teams are more than 1 hour behind.</div>" +
        card(table("Team", cols, mapped.map(teamBlock).join(""), false), "rc-card-gap");
      if (loose.length) {
        h += card(cardTitle("Not mapped") + table("Team", cols, loose.map(function (o) {
          var isR = o.t.team !== "(not mapped)", s = sides(o);
          return block({ title: isR ? o.t.team : o.t.erp_teams, sub: isR ? "Rosenta only" : "ERPNext only", rosenta: isR ? s.rosenta : null, erpnext: isR ? null : s.erpnext, cols: cols });
        }).join(""), false));
      }
      $("rc-content").innerHTML = h + '<p class="rc-hint">Boxes to pack: boxes assigned to the team in Rosenta, boxes expected on the team\'s pick lists in ERPNext. ERPNext does not record staged or loaded boxes per team. Difference is ERPNext minus Rosenta. For the last box, it says how long before Rosenta\'s last packed box ERPNext\'s last pack list was entered.</p>';
    }

    // ---- cancellations
    function cancelView() {
      $("rc-content").innerHTML =
        card(cardTitle("Cancelled in Rosenta") + '<div id="rc-t1"></div>', "rc-card-gap") +
        card(cardTitle("Cancelled in ERPNext") + '<div id="rc-t2"></div>');
      PH.table("#rc-t1", {
        rows: data.cancel_rosenta, compact: true, empty: "None", emptyText: "No orders were cancelled in Rosenta for this date.",
        rowClass: function (r) { return r.activity || String(r.erpnext).indexOf("Open") === 0 ? "rc-bad" : ""; },
        columns: [
          { key: "customer", label: "Customer", cls: "is-strong" },
          { key: "name", label: "Rosenta order" },
          { key: "boxes", label: "Boxes", num: true },
          { key: "stems", label: "Stems", num: true },
          { key: "staged", label: "Stems staged before cancelling", num: true },
          { key: "loaded", label: "Stems loaded before cancelling", num: true },
          { key: "reason", label: "Reason", format: function (v) { return String(v || "").replace(/_/g, " "); } },
          { key: "erpnext", label: "What ERPNext shows" }
        ]
      });
      PH.table("#rc-t2", {
        rows: data.cancel_erpnext, compact: true, empty: "None", emptyText: "No orders were cancelled in ERPNext for this date.",
        rowClass: function (r) { return !r.replaced_by && r.rosenta !== "Cancelled" ? "rc-bad" : ""; },
        columns: [
          { key: "customer", label: "Customer", cls: "is-strong" },
          { key: "so", label: "Sales Order" },
          { key: "name", label: "ERPNext order name" },
          { key: "boxes", label: "Boxes", num: true },
          { key: "stems", label: "Stems", num: true },
          { key: "replaced_by", label: "Replaced by" },
          { key: "rosenta", label: "What Rosenta shows" }
        ]
      });
    }

    // ---- tabs, drawing, loading
    var VIEWS = { orders: ordersView, packing: packingView, teams: teamsView, cancel: cancelView };
    function paintTabs() {
      Array.prototype.forEach.call(document.querySelectorAll("#rc-tabs .ph-tab"), function (b) {
        b.classList.toggle("is-on", b.getAttribute("data-tab") === st.get("tab"));
      });
      if (!data) return;
      var cnt = {
        orders: data.customers.filter(function (c) { return c.orders_status !== "Matches" && c.orders_status !== "-"; }).length,
        packing: data.customers.filter(function (c) { return c.pack_status !== "Matches" && c.pack_status !== "-"; }).length,
        cancel: data.cancel_rosenta.length + data.cancel_erpnext.length
      };
      Object.keys(cnt).forEach(function (k) { var el = $("rc-n-" + k); el.textContent = PH.fmt.num(cnt[k]); el.hidden = !cnt[k]; });
    }
    function draw() {
      paintTabs();
      if (!data) return;
      $("rc-warn").innerHTML = data.check && data.check.length
        ? '<div class="ph-notice ph-notice--bad ph-mb">Does not match Orders &amp; Workflow: ' + esc(data.check.join("; ")) + "</div>" : "";
      var dr = data.drafts;
      $("rc-sub").textContent = "Rosenta compared with ERPNext for " + PH.fmt.date(data.date) +
        (dr && dr.orders ? ". ERPNext drafts are not counted: " + dr.orders + " (" + PH.fmt.num(dr.boxes) + " boxes)." : ".");
      (VIEWS[st.get("tab")] || ordersView)();
    }

    function load(silent) {
      var my = ++seq;
      if (!silent) PH.skeleton("#rc-content", "rows", 8);
      PH.call("upande_packhouse.api.v2.rosenta_compare.get_rosenta_comparison", { date: st.get("date") }, { silent: true })
        .then(function (d) { if (my !== seq) return; data = d; draw(); PH.markUpdated(); })
        .catch(function (e) { if (my !== seq || silent) return; PH.error("#rc-content", e && e.message, function () { load(); }); });
    }

    // ---- wiring
    PH.dateRange({ pills: "#rc-presets", from: "#rc-date", state: st, fromKey: "date", toKey: "to" });
    st.on(function (s, changed) {
      if (changed.indexOf("date") >= 0) { data = null; load(); }
      else if (changed.indexOf("tab") >= 0 || changed.indexOf("show") >= 0) draw();
    });
    $("rc-tabs").addEventListener("click", function (e) { var b = e.target.closest(".ph-tab"); if (b) st.set({ tab: b.getAttribute("data-tab") }); });
    $("rc-content").addEventListener("click", function (e) {
      var p = e.target.closest("#rc-show button[data-value]");
      if (p) return st.set({ show: p.getAttribute("data-value") });
      var b = e.target.closest("tbody.rc-block.is-link");
      if (b && data) { var c = data.customers[+b.getAttribute("data-i")]; if (c) orderDetail(c); }
    });
    PH.onRefresh(function () { load(); return Promise.resolve(); });
    PH.poll(function () { load(true); }, POLL_MS);
    $("rc-csv").addEventListener("click", function () {
      if (!data) return;
      var rows = [];
      var add = function (section, c, k, label) { rows.push({ section: section, customer: c.customer, measure: label, rosenta: c.rosenta[k], erpnext: c.erpnext[k], difference: c.rosenta[k] == null ? "" : c.erpnext[k] - c.rosenta[k], status: section === "Orders" ? c.orders_status : c.pack_status }); };
      data.customers.forEach(function (c) {
        ORDER_COLS.filter(function (k) { return !k.value; }).forEach(function (k) { add("Orders", c, k.key, k.heading); });
        if (c.pack_status !== "-") PACK_COLS.forEach(function (k) { add("Packing", c, k.key, k.heading); });
      });
      PH.csv("rosenta-comparison-" + data.date + ".csv", rows, [
        { key: "section", label: "Section" }, { key: "customer", label: "Customer" }, { key: "measure", label: "Measure" },
        { key: "rosenta", label: "Rosenta" }, { key: "erpnext", label: "ERPNext" }, { key: "difference", label: "Difference (ERPNext minus Rosenta)" }, { key: "status", label: "Status" }]);
    });

    paintTabs();
    load();
  }

  boot();
})();

</script>
{% endraw %}
{% endblock %}
