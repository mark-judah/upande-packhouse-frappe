{#- Remote Transfers — date-control helpers shared by the page and every tab frame:
    window.rtMountDate (Frappe's Date / Datetime / Time control in place of a native
    input), rtSetDate, rtSyncDate. -#}
<style>
/* Frappe date control in place of <input type="date"> */
.aph .fdp-host{display:inline-block;vertical-align:middle}
.aph .fdp-host .frappe-control,.aph .fdp-host .form-group{margin:0!important}
/* Frappe's base control appends a developer tooltip holding the fieldname
   (<span class="tooltip-content">rl-date_fdp</span>); desk CSS hides it, website pages
   don't load that CSS, so it rendered as text next to the date. */
.aph .fdp-host .tooltip-content{display:none!important}
.aph .fdp-host input.form-control{height:30px;min-height:30px;padding:4px 10px;font:500 12px var(--f);width:128px;border:1px solid var(--hairline-2);border-radius:8px;background:var(--surface-2);color:var(--ink);box-shadow:none}
.datepickers-container{z-index:2147483600!important}  /* .aph is a fixed full-screen layer at 2147483000 */
</style>
<script>
  // Frappe's Date / Datetime / Time control in place of a native <input type="date">
  // (or datetime-local / time). The original input stays in the DOM, hidden, as the value
  // holder, so '.value' reads and 'change' listeners keep working; if the bundle
  // can't load, the native input simply stays visible.
  (function(){
  window.rtMountDate=function(input){
    if(!input||input._fdp||!window.frappe||!frappe.require) return;
    var dt=input.type==='datetime-local', tm=input.type==='time';
    frappe.require('controls.bundle.js',function(){
      try{
        if(input._fdp||!frappe.ui||!frappe.ui.form||!frappe.ui.form.make_control) return;
        var host=document.createElement('span'); host.className='fdp-host';
        input.parentNode.insertBefore(host,input);
        var ctrl=frappe.ui.form.make_control({
          parent:window.jQuery(host),
          df:{fieldtype:dt?'Datetime':(tm?'Time':'Date'),fieldname:(input.id||'date')+'_fdp',placeholder:input.getAttribute('placeholder')||'',
            change:function(){ var v=ctrl.get_value()||''; if(dt&&v) v=v.replace(' ','T').slice(0,16); if(tm&&v) v=v.slice(0,5);
              if(v!==input.value){ input.value=v; input.dispatchEvent(new Event('change',{bubbles:true})); } }},
          render_input:true, only_input:true
        });
        host.querySelectorAll('.tooltip-content').forEach(function(t){ t.remove(); });  // fieldname tooltip, see CSS
        input.style.display='none';
        input._fdp=ctrl;
        ctrl.set_value(dt&&input.value?input.value.replace('T',' ')+':00':(tm&&input.value?input.value+':00':(input.value||'')));
      }catch(e){ /* keep the native date input */ }
    });
  };
  /* Set a mounted (or native) date / datetime input's value without firing change. */
  window.rtSetDate=function(input,v){
    if(!input) return; input.value=v||'';
    if(input._fdp){ var dt=input.type==='datetime-local', tm=input.type==='time';
      input._fdp.set_value(dt&&v?v.replace('T',' ')+':00':(tm&&v?v+':00':(v||''))); }
  };
  window.rtSyncDate=function(input){ if(input&&input._fdp&&input._fdp.get_value()!==input.value) input._fdp.set_value(input.value||''); };
  })();
</script>
